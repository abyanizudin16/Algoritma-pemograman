<!DOCTYPE html>
<html>
    <head>
        <title>Variabel JavaScript</title>
    </head>
    <body>
        <h2>Program Pengenalan Variabel JavaScript</h2>
        <script>
            // Membuat vaiabel
            let nama = "M.Abyan"
            let umur = 18;
            let tinggi = 167.5;
            

            // Menampilakan nilai dan tipe variabel
            document.write("Nama : " + nama + " | Tipe : " + typeof nama + "<br>");
            document.write("Umur : " + umur + " | Tipe : " + typeof umur + "<br>");
            document.write("Tinggi : " + tinggi + " | Tipe : " + typeof tinggi + "<br>"); 
        </script>
    </body>
</html>
